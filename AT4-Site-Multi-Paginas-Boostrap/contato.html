   <main class="container my-5 text-center">
    <h1 class="text-info mb-4">Entre em Contato</h1>
    
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <form action="https://formspree.io/f/o_teu_codigo_aqui" method="POST" class="text-start">
                <div class="mb-3">
                    <label for="nome" class="form-label text-white">Nome:</label>
                    <input type="text" id="nome" name="nome" class="campo-formulario form-control" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label text-white">E-mail:</label>
                    <input type="email" id="email" name="email" class="campo-formulario form-control" required>
                </div>
                <div class="mb-3">
                    <label for="mensagem" class="form-label text-white">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="4" class="campo-formulario form-control" required></textarea>
                </div>
                <button type="submit" class="btn w-100 fw-bold mt-2" style="background-color: #00f0ff; color: #121214;">Enviar</button>
            </form>
        </div>
    </div>
